# auto-albums — álbumes de Immich que se rellenan solos por persona (ver README.md)
#
#   cd /volume1/docker/mediastack/auto-albums
#   docker compose config >/dev/null && docker compose up -d
#
# Sin build: imagen oficial de Python (ya descargada en el NAS) + el script montado.
name: auto-albums

services:
  auto-albums:
    container_name: auto-albums
    image: python:3.12-alpine
    command: ["python", "-u", "/app/auto_albums.py"]
    # Mismo usuario que el resto del stack; el grupo 101 por las ACL de Synology
    # (ver "Trampas" en HANDOFF.md).
    user: "1026:100"
    group_add: ["101"]
    env_file:
      - .env            # IMMICH_API_KEY (no va al repo; plantilla en .env.example)
    environment:
      - TZ=Europe/Madrid
      - IMMICH_URL=http://immich_server:2283
      - CONFIG=/app/config.json
      - ESTADO=/estado/estado.json
    volumes:
      # La CARPETA, no los ficheros sueltos: `git pull` sustituye los ficheros (inodo nuevo)
      # y un montaje de fichero suelto seguiría viendo la versión vieja hasta reiniciar.
      # Pasó el 2026-11-02 con el álbum «Nietos». Montando la carpeta, config.json se relee
      # de verdad en cada pasada.
      - ./:/app:ro
      # Estado fuera del repo (regla 5): nombre de álbum → id en Immich, última pasada.
      - /volume1/docker/mediastack-data/auto-albums:/estado
    networks:
      - mediastack-net
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

networks:
  mediastack-net:
    external: true
