# Immich — capa propia sobre el docker-compose.yml OFICIAL (en el NAS desde 2026-10-23)
#
# El docker-compose.yml de Immich NO se edita nunca: se descarga tal cual de la release
# y se actualiza con cada versión. Todo lo nuestro vive aquí.
#
#   cd /volume1/docker/mediastack/immich
#   V=v3.3.5   # la release que se instala; igual que IMMICH_VERSION en .env
#   for f in docker-compose.yml hwaccel.transcoding.yml hwaccel.ml.yml; do
#     wget -O $f https://github.com/immich-app/immich/releases/download/$V/$f; done
#   docker compose config >/dev/null && docker compose up -d
#
# Comprobar la fusión antes de arrancar:  docker compose config

services:
  immich-server:
    environment:
      - TZ=${TZ}
    volumes:
      # Biblioteca externa: el histórico que ya está en el NAS (Synology Photos).
      # :ro es deliberado — Immich no podrá borrar ni modificar nada de ahí.
      # En la web: Administración → Bibliotecas externas → ruta /fotos-historico
      # Las carpetas @eaDir, #recycle y ._* de Synology las excluye Immich por defecto.
      - ${EXTERNAL_LIBRARY}:/fotos-historico:ro
    # Intel QuickSync del J4125 para convertir vídeo. Solo da acceso al dispositivo;
    # se activa en la web: Administración → Ajustes → Transcodificación de vídeo →
    # Aceleración por hardware → Quick Sync.
    devices:
      - /dev/dri:/dev/dri
    # Techo de memoria. El NAS tiene 18 GB, pero comparte máquina con ~35 contenedores
    # más: un pico de Immich no puede llevarse por delante al resto.
    mem_limit: 3g

  database:
    environment:
      # La base de datos va sobre los discos mecánicos del NAS (el DS224+ no tiene
      # SSD de datos). Con esto Immich ajusta Postgres a disco lento. Es la opción
      # que la propia plantilla oficial deja comentada para este caso.
      DB_STORAGE_TYPE: 'HDD'
    mem_limit: 1536m

  redis:
    mem_limit: 256m

  # ---------------------------------------------------------------------------
  # MACHINE LEARNING (caras y búsqueda por contenido) — APAGADO AL PRINCIPIO
  #
  # Con 18 GB la RAM ya no es el problema. El problema es el DISCO: el primer
  # escaneo de 200.000+ fotos lee cada original para sacar miniaturas, y el ML
  # vuelve a leerlas. Todo a la vez satura los discos y ralentiza todo el NAS
  # (pasó con Immich en julio: 55% de iowait). Por eso se enciende DESPUÉS de
  # que terminen las miniaturas:
  #
  #     bash /volume1/docker/mediastack/scripts/ml.sh on
  #
  # Cuando el histórico esté procesado se puede dejar encendido siempre:
  # el gasto diario es pequeño.
  # ---------------------------------------------------------------------------
  immich-machine-learning:
    profiles: ["ml"]
    mem_limit: 3g
    environment:
      # Un solo hilo de inferencia: más lento, pero no ahoga los 4 núcleos del J4125
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=300

# El pool de subredes automáticas de Docker en este NAS está AGOTADO: un compose
# que crea su red propia no arranca. Se usa una red creada a mano con subred fija:
#   docker network create --subnet 10.100.5.0/24 mediastack-net
networks:
  default:
    name: mediastack-net
    external: true
