name: jellyfin

services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    # jaime:users en el NAS (1026:100)
    user: "${PUID:-1026}:${PGID:-100}"
    # Grupo dueño de /dev/dri/renderD128 en el NAS (937, "videodriver"). Sin él,
    # Jellyfin ve el dispositivo pero no puede abrirlo y cae a convertir por CPU.
    # Comprobar:  ls -ln /dev/dri
    group_add:
      - "${RENDER_GID:-937}"
    restart: always
    ports:
      - "8096:8096"       # HTTP
      # - "7359:7359/udp" # autodescubrimiento en LAN por clientes Jellyfin
    environment:
      - TZ=${TZ:-Europe/Madrid}
      # URL pública, cuando se publique por el túnel:
      # - JELLYFIN_PublishedServerUrl=https://video.ruizespana.com
    # Intel QuickSync del J4125. Se activa en la web:
    # Panel → Reproducción → Transcodificación → Aceleración por hardware → Intel QuickSync (QSV)
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # config y cache: disco local del NAS, fuera del repo git (SQLite + miniaturas).
      - /volume1/docker/mediastack-data/jellyfin/config:/config
      - /volume1/docker/mediastack-data/jellyfin/cache:/cache
      # Biblioteca de vídeo, solo lectura.
      - /volume1/video:/media:ro
    mem_limit: 2g

# Red con subred fija: el pool automático del NAS está agotado. Ver immich/.
networks:
  default:
    name: mediastack-net
    external: true
