name: navidrome

services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    # jaime:users en el NAS (1026:100). Tiene que poder leer /volume1/music y
    # escribir en su carpeta de datos.
    user: "${PUID:-1026}:${PGID:-100}"
    # Grupo "administrators" de DSM (101). Las ACL de Synology dan acceso a jaime por
    # pertenecer a ese grupo, y un contenedor no hereda los grupos del usuario: sin esta
    # línea no puede leer /volume1/music ni escribir en su carpeta (comprobado 2026-10-23).
    group_add:
      - "${ADMIN_GID:-101}"
    ports:
      - "4533:4533"
    restart: always
    environment:
      ND_LOGLEVEL: info
      # Escaneo programado de madrugada. La vigilancia continua de ficheros no hace
      # falta: la música cambia poco y así no hay lecturas constantes del disco.
      ND_SCANSCHEDULE: "0 4 * * *"      # todos los días a las 4:00
      ND_ENABLEWATCHER: "false"
      ND_SESSIONTIMEOUT: 24h
      ND_LASTFM_ENABLED: "false"
    volumes:
      # SQLite de Navidrome: disco local del NAS, fuera del repo git.
      - /volume1/docker/mediastack-data/navidrome:/data
      # Biblioteca musical, solo lectura.
      - /volume1/music:/music:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4533/ping"]
      interval: 1m
      timeout: 10s
      retries: 3

# Red con subred fija: el pool automático del NAS está agotado. Ver immich/.
networks:
  default:
    name: mediastack-net
    external: true
