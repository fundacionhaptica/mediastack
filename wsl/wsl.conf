# Copiar a /etc/wsl.conf DENTRO de Ubuntu (sudo).
# Aplicar con:  wsl --shutdown  desde Windows.

[boot]
# systemd es lo que arranca dockerd y los montajes de /etc/fstab solos.
systemd=true

[user]
# Sin esto la distro entra como root (se instalo con --no-launch, sin el asistente
# que crea el usuario). Todo el stack se maneja desde esta cuenta, no desde root.
default=jaime

[automount]
enabled = true
# Sin esto, los discos de Windows se montan con permisos 777 y ensucian los
# chequeos de permisos. Los ficheros multimedia NO vienen por aquí, vienen por NFS.
options = "metadata,umask=22,fmask=11"

[network]
generateHosts = true
generateResolvConf = true

[interop]
enabled = true
appendWindowsPath = false
